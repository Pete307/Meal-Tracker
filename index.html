<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8e123c"><link rel="manifest" href="manifest.webmanifest"><title>Farm Team Fuel</title><style>body{margin:0;background:#10131b;color:#f8f8fa;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}h1{margin:0;color:white}h2{font-size:20px}.muted,small{color:#b9bdc7}small{display:block;font-size:12px}.card{background:#202633;padding:18px;border-radius:16px;margin:14px 0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:12px 1px;font-size:13px}.active{background:#8e123c!important;color:white}button{background:#343b4a;border:0;color:white;border-radius:9px;padding:11px;cursor:pointer}button.primary{background:#8e123c;font-weight:bold}input{box-sizing:border-box;background:#10131b;color:white;border:1px solid #626a79;padding:12px;border-radius:8px;width:100%;margin:5px 0 12px}.hidden{display:none}.track{height:13px;background:#424b5b;border-radius:20px;overflow:hidden;flex:1}.bar{background:#cf3265;height:100%;width:0}.weekrow,.entry,.flex{display:flex;align-items:center;gap:12px;justify-content:space-between;margin:10px 0}.entry{border-bottom:1px solid #414654;padding:9px 0}.delete{background:#4b2531}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#293040;padding:15px;border-radius:12px}.big{font-size:29px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}label{font-size:14px;color:#d4d6dc}p{line-height:1.5}</style></head><body><main><header><h1>🏈 Farm Team Fuel</h1><small>CHADRON STATE · 210 LB · 6'4" · AGE 21</small></header><section class="card"><div class="days" id="days"></div><h2 id="dayTitle"></h2><strong id="dayType"></strong><p id="activity"></p><small id="advice"></small></section><section class="card"><div class="flex"><strong>Daily calories</strong><span id="goal"></span></div><div class="big" id="eaten"></div><div class="track"><div class="bar" id="fill"></div></div><div class="flex"><small id="percent"></small><small id="remaining"></small></div><div class="stats"><div class="stat"><small>Protein tracked</small><div class="big" id="protein"></div><small>Goal 180–200g</small></div><div class="stat"><small>Calorie target</small><div class="big" id="target"></div></div></div></section><section class="card"><div class="flex"><h2>Food log</h2><button class="primary" id="toggleForm">+ Add meal</button></div><form id="mealForm" class="hidden"><label>Food or meal<input id="food" required maxlength="120" placeholder="Chicken and rice"></label><label>Calories<input id="calories" required type="number" min="1" max="15000"></label><label>Protein (grams)<input id="grams" type="number" min="0" max="500"></label><button class="primary">Save meal</button></form><div id="meals"></div></section><section class="card"><h2>Weekly progress · Oct 19–25</h2><div id="weekly"></div></section><section class="card"><h2>Weight check-ins</h2><div class="flex"><input id="weight" type="number" placeholder="Weight (lb)" min="50" max="600" step=".1"><button class="primary" id="saveWeight">Save</button></div><small id="weightHistory"></small></section><section class="card"><h2>Your data</h2><p class="muted">Saved locally on this device. Export a backup before clearing browser data or switching phones.</p><div class="actions"><button id="export">Export backup</button><button id="importButton">Import backup</button><button id="reset">Clear all data</button><input class="hidden" type="file" id="importFile" accept=".json,application/json"></div></section></main><script src="app.js"></script></body></html>
